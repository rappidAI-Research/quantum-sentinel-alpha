# Selected training foundation for Quantum Sentinel Alpha.
# Source of truth for the base model. Validated by `python -m sentinel.foundation`
# (sentinel/foundation_model.py). Decision record: docs/FOUNDATION.md.
#
# Changing `model_id` or `revision` is a deliberate, reviewed decision: update the decision
# record, the baseline candidate pin, the LoRA module list and docs/STATUS.md in the same change.
schema_version: "1.0"
foundation_status: selected

model_id: ornith-ai/Ornith-1.5-9B
revision: 489cb97981b8654bcfcf30ce1f94ed1b62e07b53   # immutable Hugging Face commit SHA (main on 2026-11-24, last modified 2026-08-23)
license: MIT                                          # model-card metadata; the linked LICENSE file is absent at this revision (docs/FOUNDATION.md)
architecture: Qwen3_5ForConditionalGeneration         # loaded text-only as Qwen3_5ForCausalLM (vision tower and MTP head are not loaded)
bf16_weight_gib: 18.0                                  # 19,306,208,736 bytes in four safetensors shards
metadata_verified_at: "2026-11-24"   # revision, files, tensor shapes, tokenizer and chat template read from the HF API; no weights downloaded

# SHA-256 of the small files the training and evaluation paths depend on, as served at `revision`.
# Informational (the revision pin already makes them immutable); tests/test_foundation_compat.py
# runs against exactly these files.
files_sha256:
  config.json: 1f1b3751c38f16a63340df90a55e870bef0f0b2968d833825a605b7cf930a313
  tokenizer.json: 5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42
  tokenizer_config.json: 316230d6a809701f4db5ea8f8fc862bc3a6f3229c937c174e674ff3ca0a64ac8
  chat_template.jinja: 9dd2fbd270feaa1fbef2d4f634d7887c9c506e3bde140f8e7351c8944e8fd235

decision:
  date: "2026-11-24"
  decided_by: rappidAI Research (project owner instruction, 24 November 2026)
  replaces: Qwen/Qwen3.5-9B@c202236235762e1c871ad0ccb60c8ee5ba337b9a as the active training foundation (selected 2026-11-04)
  basis: expected_capability     # NOT an experimentally demonstrated security advantage
  rationale:
    - Same Qwen3.5 text architecture, tensor layout and tokenizer as the previous foundation (verified file by file), so the QLoRA setup, the 200 LoRA targets and the Garden v3 token budget carry over unchanged.
    - Further trained by its authors for coding and agentic tasks; the model card reports higher coding scores than Qwen3.5-9B (vendor-reported, not reproduced here).
    - Official chat template supports a non-thinking generation prompt (enable_thinking=false), which the strict JSON output contract needs.
    - Fits unquantized in bf16 on one 48 GB L40S for evaluation; QLoRA (4-bit base) training fits the same GPU.
  not_claimed:
    - No QuickEval or coding-regression result exists for Ornith-1.5-9B.
    - The vendor benchmarks have not been reproduced and do not measure vulnerability detection.
    - Ornith has not been shown to outperform Qwen3.5-9B on security tasks.
  open_evidence:
    - Foundation baseline run of the selected checkpoint on QuickEval v1 and coding-v1 (before any adapter).
    - Reliability of the non-thinking JSON output path on real generations (GPU required).

# Earlier foundations stay documented; they are not used for training.
history:
  - model_id: Qwen/Qwen3.5-9B
    revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    license: Apache-2.0
    selected: "2026-11-04"
    superseded: "2026-11-24"

# The baseline evaluation path. The candidate named here must carry exactly the model ID and
# revision above (checked by `python -m sentinel.foundation`). Qwen3.5-9B remains in the same
# config as an optional reference; it is not a prerequisite for training.
optional_comparison:
  bakeoff_config: configs/model/baseline_ornith15.yaml
  baseline_candidate: ornith15-9b
  alternatives:
    - model_id: Qwen/Qwen3.5-9B
      revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
      role: optional_reference
