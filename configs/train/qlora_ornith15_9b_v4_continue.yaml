# Approach A: CONTINUE from the first run's selected checkpoint (step-000200, development selection rule
# v1) on Garden v4, with a NEW optimizer and learning-rate schedule (docs/TRAINING_V4.md).
# Run:      python -m sentinel.train --config configs/train/qlora_ornith15_9b_v4_continue.yaml
# Check:    python -m sentinel.train --config configs/train/qlora_ornith15_9b_v4_continue.yaml --dry-run
#
# Only the adapter weights are taken from the checkpoint; its optimizer, scheduler and RNG state are not.
# The checkpoint must be unmodified (its checksums.json) and written by the first run: its provenance
# must name configs/train/qlora_ornith15_9b.yaml (source_config_sha256) and the Garden v3 training data
# (source_data_sha256, the data sha256 that run.json of the first run records). Same LoRA shape as the
# first run, so every tensor is loaded unchanged (sentinel/train/trainer.py `check_init_adapter`).
schema_version: "1.0"
run_name: qsa-qlora-ornith15-9b-v4-continue
foundation: configs/model/foundation.yaml

data:
  garden_config: configs/garden/seed_v4.yaml     # Garden v4; train.chat.jsonl / validation.jsonl in its workdir (`materialize`)
  max_seq_len: 4096          # examples longer than this are dropped and counted, never truncated
  end_of_turn: "<|im_end|>"  # appended to each assistant reply; must be a single token of the tokenizer
  tasks: [detection, patch]  # owner decision 2026-11-24: also train patch generation on verified upstream fixes (docs/PATCH_SUPERVISION.md); [detection] for detection only

quantization:
  mode: nf4                  # nf4 (QLoRA, bitsandbytes 4-bit) | none (bf16 LoRA)
  double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  # Derived from the real module layout (configs/train/ornith15_9b_linear_modules.txt): all attention,
  # Gated DeltaNet and MLP projections of the 32 text layers. Excluded: in_proj_a / in_proj_b
  # (4096 -> 32 gating projections, too small for rank-16 updates), lm_head and every non-text module.
  target_modules: '^model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|linear_attn\.(in_proj_qkv|in_proj_z|out_proj)|mlp\.(gate_proj|up_proj|down_proj))$'
  expected_target_count: 200 # 8 full-attention x 4 + 24 linear-attention x 3 + 32 MLP x 3

training:
  seed: 1234
  learning_rate: 5.0e-5      # half the first run's: the adapter is already adapted; a full restart would undo it
  warmup_ratio: 0.05         # fresh AdamW moments: warm up before the full step size
  weight_decay: 0.0
  num_epochs: 1              # Garden v4 repeats the v3 examples the adapter has already seen ~1.7 times
  max_steps: null
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  gradient_checkpointing: true
  eval_every_steps: 25
  save_every_steps: 25
  keep_last_checkpoints: 20
  logging_every_steps: 1

output_dir: runs/train/qsa-qlora-ornith15-9b-v4-continue   # Git-ignored; adapter-only outputs

init_adapter:
  checkpoint: runs/train/qsa-qlora-ornith15-9b-v0/checkpoints/step-000200
  step: 200
  source_config_sha256: c91cb7c73e3f4779cfcc3b78b700f00bf0d3b22b31a1b5dd6e6fcf9bb0269f07   # configs/train/qlora_ornith15_9b.yaml
  source_data_sha256: c47e36167f2d0317a8853ae00af353380b7550b16a140548ba3a8b4a08608518     # Garden v3, tasks detection + patch
