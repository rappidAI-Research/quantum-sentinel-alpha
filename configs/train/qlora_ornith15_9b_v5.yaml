# A FRESH QLoRA adapter on the pinned foundation, trained on Garden v5 (docs/TRAINING_V5.md). The owner decided on
# 2026-11-25 not to continue from the first run's adapter; its checkpoints stay as the historical baseline.
# Run:      python -m sentinel.train --config configs/train/qlora_ornith15_9b_v5.yaml
# Check:    python -m sentinel.train --config configs/train/qlora_ornith15_9b_v5.yaml --dry-run --check-tokens
#
# Same foundation, LoRA shape, sequence length, schedule and prompt contract as the first run
# (configs/train/qlora_ornith15_9b.yaml), so the two differ only in data. Model ID and revision come from configs/model/foundation.yaml.
schema_version: "1.0"
run_name: qsa-qlora-ornith15-9b-v5
foundation: configs/model/foundation.yaml

data:
  garden_config: configs/garden/seed_v5.yaml     # Garden v5; train.chat.jsonl / validation.jsonl in its workdir (`materialize`)
  max_seq_len: 4096          # examples longer than this are dropped and counted, never truncated
  end_of_turn: "<|im_end|>"  # appended to each assistant reply; must be a single token of the tokenizer
  tasks: [detection, patch]  # owner decision 2026-11-24: also train patch generation on verified upstream fixes (docs/PATCH_SUPERVISION.md); [detection] for detection only

quantization:
  mode: nf4                  # nf4 (QLoRA, bitsandbytes 4-bit) | none (bf16 LoRA)
  double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  # Derived from the real module layout (configs/train/ornith15_9b_linear_modules.txt): all attention,
  # Gated DeltaNet and MLP projections of the 32 text layers. Excluded: in_proj_a / in_proj_b
  # (4096 -> 32 gating projections, too small for rank-16 updates), lm_head and every non-text module.
  target_modules: '^model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|linear_attn\.(in_proj_qkv|in_proj_z|out_proj)|mlp\.(gate_proj|up_proj|down_proj))$'
  expected_target_count: 200 # 8 full-attention x 4 + 24 linear-attention x 3 + 32 MLP x 3

training:
  seed: 1234
  learning_rate: 1.0e-4      # as the first run: its loss and development results give no reason to change it
  warmup_ratio: 0.03
  weight_decay: 0.0
  num_epochs: 2              # the first run's selected checkpoint was step 200 of 234 (1.7 epochs); more epochs are not assumed to help
  max_steps: null
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  gradient_checkpointing: true
  eval_every_steps: 25       # finer than the first run (50): the selection rule compares checkpoints on the development set
  save_every_steps: 25
  keep_last_checkpoints: 20  # keep every checkpoint for the development-set comparison (about 0.5 GB each)
  logging_every_steps: 1

output_dir: runs/train/qsa-qlora-ornith15-9b-v5   # Git-ignored; adapter-only outputs
