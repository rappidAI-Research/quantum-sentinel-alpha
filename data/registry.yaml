  - source_id: secodeplt
    role: eval_only
    revision: null
    license: review required
    license_status: unreviewed
    terms_status: review_required
    redistribution_status: not_redistributed
    removal_status: not_applicable
    pii_risk: unknown
    production_approved: false
    owner: rappidAI Research
    reviewer: null
    evidence_urls:
      - https://github.com/ucsb-mlsec/SeCodePLT
    notes: Public evaluation candidate only; keep training decontamination explicit.

  - source_id: primevul
    role: eval_only
    revision: null
    license: review required
    license_status: unreviewed
    terms_status: review_required
    redistribution_status: not_redistributed
    removal_status: not_applicable
    pii_risk: unknown
    production_approved: false
    owner: rappidAI Research
    reviewer: null
