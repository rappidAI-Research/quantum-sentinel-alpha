      - https://github.com/DLVulDet/PrimeVul
    notes: Detection/hard-negative reference for evaluation; not an approved training source.

  - source_id: quickeval-synthetic-v1
    role: eval_only
    revision: null
    license: project-authored clean-room synthetic cases; repository license not yet declared
    license_status: review_required
    terms_status: review_required
    redistribution_status: unreviewed
    removal_status: ready
    pii_risk: low
    production_approved: false
    owner: rappidAI Research
    reviewer: null
    evidence_urls:
      - https://github.com/rappidAI-Research/quantum-sentinel-alpha/blob/main/eval/sentinelbench/quickeval_v1.jsonl
    notes: >-
      86 clean-room QuickEval cases (vulnerable, hard-negative, abstention) used for the
      foundation bake-off. Public, therefore not a holdout. Registered so it can never be
      approved for training; its cases, labels and neighbours must stay out of training data.

  - source_id: coding-regression-v1
    role: eval_only
    revision: null
    license: project-authored clean-room tasks; repository license not yet declared
    license_status: review_required
    terms_status: review_required
    redistribution_status: unreviewed
    removal_status: ready
    pii_risk: low
    production_approved: false
    owner: rappidAI Research
    reviewer: null
    evidence_urls:
      - https://github.com/rappidAI-Research/quantum-sentinel-alpha/blob/main/eval/coding/coding_v1.jsonl
    notes: >-
      16 clean-room Python coding tasks with reference solutions and hidden tests, used only
      to detect general coding regressions in the foundation bake-off. Never a training source.

  - source_id: ghsa-osv-fix-commits
    role: train_candidate
    revision: null
    license: upstream repository license, per repository (recorded per record by Sentinel Garden)
    license_status: review_required
    terms_status: review_required
    redistribution_status: not_redistributed
    removal_status: ready
    pii_risk: low
    production_approved: false
    owner: rappidAI Research
    reviewer: null
    evidence_urls:
      - https://github.com/rappidAI-Research/quantum-sentinel-alpha/blob/main/docs/SENTINEL_GARDEN.md
    notes: >-
      Function-level vulnerable/fixed code resolved by Sentinel Garden from upstream fix commits
      referenced by GitHub-reviewed advisories (discovered via osv / github-advisory-db metadata).
      Code is fetched by immutable commit SHA and is not committed to this repository. Training use
      additionally requires a per-repository approval in data/garden/approvals.yaml. A source-level
      approval here does not approve any repository.
