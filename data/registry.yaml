  - source_id: ghsa-osv-fix-commits
    role: train_candidate
    revision: "sentinel-garden-v5 candidate list (the v3 OSV snapshot published-before 2026-11-01 plus the v5 extension), candidates sha256 af72c35dfc220aa1406aac7571156bcd7262234bb541951d81bd8962f8d479bf"
