    reviewer: Jonas Cikemgil
    evidence_urls:
      - https://github.com/rappidAI-Research/quantum-sentinel-alpha/blob/main/docs/SENTINEL_GARDEN.md
    notes: >-
      Approved for training on 2026-11-15 by Jonas Cikemgil (project owner) for the Sentinel Garden v2 training cohort; extended by him on 2026-11-24 to the Garden v3 candidate list (same OSV snapshot) and on 2026-11-25 to the Garden v5 candidate list (v3 list plus pull-request fixes resolved to their merge commit and advisories over the former repository cap); decision record docs/TRAINING_AUTHORIZATION.md. Not redistributed: code excerpts and advisory text are not republished by this project.
      Function-level vulnerable/fixed code resolved by Sentinel Garden from upstream fix commits
      referenced by GitHub-reviewed advisories (discovered via osv / github-advisory-db metadata).
      Code is fetched by immutable commit SHA and is not committed to this repository. Training use
      additionally requires a per-repository approval in data/garden/approvals.yaml. A source-level
      approval here does not approve any repository.

  # ---- Garden v6 (2026-11-25): new sources. None is approved; the owner decides (data/garden/seed_v6/cohort/OWNER_DECISION.md).
  - source_id: morefixes
    role: metadata
    revision: "Zenodo record 20776007, dump-2026-06-20.sql.gz (md5 bdff6120f1e65626c77d42656162316e), CVEs up to 2026-06-02"
    license: CC-BY-4.0
    license_status: review_required
    terms_status: review_required
    redistribution_status: not_redistributed
    removal_status: ready
    pii_risk: low
    production_approved: false
    owner: rappidAI Research
    reviewer: null
    evidence_urls:
      - https://zenodo.org/records/20776007
      - https://github.com/JafarAkhondali/Morefixes
    notes: >-
      Discovery index only (CVE -> repository -> fix commit, CWE classification). Only the metadata tables are
      read; MoreFixes' code, diffs and method tables are never used, the code comes from the pinned upstream commit.
      Fix commits that only MoreFixes' mining links to a CVE (Prospector score) are not used; a candidate needs a fix
      commit named by the CVE's own NVD references. CC-BY-4.0 requires attribution (docs/GARDEN_V6.md). Commit
      author names and e-mail addresses in its commits table are never copied into committed files.

