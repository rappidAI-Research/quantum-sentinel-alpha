[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-sentinel-alpha"
version = "0.0.0"
description = "Quantum Sentinel-Alpha security-model research, evaluation and governed training pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
  # Sentinel Garden parses Go/JavaScript/TypeScript with tree-sitter. Exact pins: the grammar
  # decides function boundaries and normalized hashes, so a version change is a dataset change.
  "tree-sitter==0.26.0",
  "tree-sitter-go==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]
# Real model runs (Linux/CUDA). Qwen3.5 (model_type qwen3_5) needs Transformers 5.x;
# 5.12 is the minimum the bake-off supports.
model = [
  "torch>=2.5",
  "transformers>=5.12,<6",
  "accelerate>=1.1",
]
# Optional bitsandbytes quantization (--quantization bnb-4bit / bnb-8bit).
quant = [
  "bitsandbytes>=0.45",
]
# QLoRA training (python -m sentinel.train) and adapter evaluation (run_model --adapter).
train = [
  "torch>=2.5",
  "transformers>=5.12,<6",
  "accelerate>=1.1",
  "peft>=0.17",
  "safetensors>=0.4",
  "bitsandbytes>=0.45",
]

[project.urls]
Homepage = "https://www.rappidai-research.com/models/quantum-sentinel-alpha"
Repository = "https://github.com/rappidAI-Research/quantum-sentinel-alpha"
Documentation = "https://github.com/rappidAI-Research/quantum-sentinel-alpha/tree/main/docs"
Issues = "https://github.com/rappidAI-Research/quantum-sentinel-alpha/issues"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
