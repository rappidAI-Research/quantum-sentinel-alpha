[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-sentinel-alpha"
version = "0.0.0"
description = "rappidAI Research Quantum Sentinel Alpha foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]
# Real model runs (Linux/CUDA). Qwen3.5 (model_type qwen3_5) needs Transformers 5.x;
# 5.12 is the minimum the bake-off supports.
model = [
  "torch>=2.5",
  "transformers>=5.12,<6",
  "accelerate>=1.1",
]
# Optional bitsandbytes quantization (--quantization bnb-4bit / bnb-8bit).
quant = [
  "bitsandbytes>=0.45",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
